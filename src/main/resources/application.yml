server:
  port: 8080
  error:
    include-message: always

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gateway_auth}
    username: ${SPRING_DATASOURCE_USERNAME:gateway_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:gateway_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

app:
  geolocation:
    enabled: true

client-management-api:
  base-url: ${CLIENT_MANAGEMENT_API_BASE_URL:http://localhost:8081}