services:
  client-hub-gateway-db:
    container_name: client-hub-gateway-postgres
    image: postgres:15.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB} 
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres
    volumes:
      - postgres-data:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - gateway-network
    restart: unless-stopped

  client-hub-gateway-service:
    container_name: client-hub-gateway-service
    build: .
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://client-hub-gateway-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER} 
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      CLIENT_HUB_API_BASE_URL: http://client-hub-api:8080
    networks:
      - gateway-network
    depends_on:
      - client-hub-gateway-db
    restart: unless-stopped
    
networks:
  gateway-network:
    driver: bridge

volumes:
  postgres-data:
